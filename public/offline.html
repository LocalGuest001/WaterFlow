<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>WaterFlow Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(14, 165, 233, 0.18), transparent 42%),
          linear-gradient(180deg, #f8fbff 0%, #eef6ff 100%);
        color: #0f172a;
      }

      .card {
        width: min(100%, 28rem);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        padding: 28px;
        text-align: center;
      }

      .icon {
        width: 76px;
        height: 76px;
        margin: 0 auto 18px;
        border-radius: 24px;
        background: linear-gradient(135deg, #0f766e, #0284c7);
        display: grid;
        place-items: center;
      }

      .icon img {
        width: 52px;
        height: 52px;
      }

      h1 {
        margin: 0;
        font-size: 1.75rem;
        line-height: 1.1;
      }

      p {
        margin: 12px 0 0;
        color: #475569;
        line-height: 1.6;
      }

      .actions {
        margin-top: 24px;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: #0284c7;
        color: white;
        font-weight: 700;
        padding: 12px 18px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">
        <img src="/icon-192.png" alt="WaterFlow" />
      </div>
      <h1>You’re offline</h1>
      <p>WaterFlow is still available from cached assets. Reconnect to sync your latest deliveries.</p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
